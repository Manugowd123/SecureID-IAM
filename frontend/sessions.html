<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureID - Active Device Sessions</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .session-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .session-current {
      border-color: rgba(37, 99, 235, 0.4);
      background: rgba(37, 99, 235, 0.06);
    }
    .badge-current {
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.3);
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: 600;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card" style="max-width: 620px;">
      <div class="brand-header">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24">
            <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
          </svg>
          <span class="brand-title">SecureID</span>
        </div>
      </div>

      <div id="alertBox" class="alert"></div>

      <!-- ACTIVE SESSIONS PANEL -->
      <div id="sessionsPanel" class="step-panel active">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <div>
            <h2 class="step-title" style="margin-bottom: 4px;">Active Sessions</h2>
            <p class="step-description">Devices currently logged into your account.</p>
          </div>
          <button type="button" id="revokeOthersBtn" class="btn-secondary" style="font-size: 0.8rem; padding: 8px 12px;">
            <span>Sign Out Other Devices</span>
          </button>
        </div>

        <div id="sessionsListContainer" style="margin-top: 20px;">
          <p style="text-align: center; color: var(--text-muted); padding: 20px;">Loading sessions...</p>
        </div>

        <div style="margin-top: 24px; display: flex; gap: 12px;">
          <a href="profile.html" class="btn-secondary" style="flex: 1; text-decoration: none; text-align: center;">
            <span>Back to Profile</span>
          </a>
          <a href="login.html" class="btn-secondary" style="flex: 1; text-decoration: none; text-align: center;">
            <span>Dashboard</span>
          </a>
        </div>
      </div>

    </div>
  </div>

  <script src="js/sessions.js"></script>
</body>
</html>
