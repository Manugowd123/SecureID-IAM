<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureID - User Profile & Security</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="card" style="max-width: 580px;">
      <div class="brand-header">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24">
            <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
          </svg>
          <span class="brand-title">SecureID</span>
        </div>
      </div>

      <div id="alertBox" class="alert"></div>

      <!-- PROFILE MANAGEMENT PANEL -->
      <div id="profilePanel" class="step-panel active">
        <h2 class="step-title">Account Profile & Security</h2>
        <p class="step-description">Manage your personal identity details and security settings.</p>

        <!-- IDENTITY BADGES -->
        <div style="display: flex; gap: 12px; margin: 20px 0; justify-content: center;">
          <span id="emailBadge" style="background: rgba(34, 197, 94, 0.15); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.3); padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600;">✓ Email Verified</span>
          <span id="mfaBadge" style="background: rgba(37, 99, 235, 0.15); color: #60a5fa; border: 1px solid rgba(37, 99, 235, 0.3); padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600;">🔒 SMS MFA Active</span>
        </div>

        <!-- UPDATE PROFILE FORM -->
        <form id="profileForm" novalidate style="margin-top: 20px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 20px; border-radius: 10px;">
          <h3 style="font-size: 1rem; color: var(--text-main); margin-bottom: 16px;">Personal Information</h3>

          <div style="display: flex; gap: 12px;">
            <div class="form-group" style="flex: 1;">
              <label for="firstName">First Name</label>
              <input type="text" id="firstName" required>
            </div>
            <div class="form-group" style="flex: 1;">
              <label for="lastName">Last Name</label>
              <input type="text" id="lastName" required>
            </div>
          </div>

          <div class="form-group">
            <label for="emailDisplay">Email Address (Primary ID)</label>
            <input type="email" id="emailDisplay" disabled style="opacity: 0.7; cursor: not-allowed;">
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" required>
          </div>

          <button type="submit" id="updateProfileBtn" class="btn-primary" style="margin-top: 8px;">
            <span class="spinner" id="profileSpinner"></span>
            <span id="profileBtnText">Save Profile Changes</span>
          </button>
        </form>

        <!-- CHANGE PASSWORD FORM -->
        <form id="changePasswordForm" novalidate style="margin-top: 24px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 20px; border-radius: 10px;">
          <h3 style="font-size: 1rem; color: var(--text-main); margin-bottom: 16px;">Change Password</h3>

          <div class="form-group">
            <label for="currentPassword">Current Password</label>
            <input type="password" id="currentPassword" placeholder="••••••••" required>
          </div>

          <div class="form-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" placeholder="••••••••" required>
          </div>

          <div class="form-group">
            <label for="confirmNewPassword">Confirm New Password</label>
            <input type="password" id="confirmNewPassword" placeholder="••••••••" required>
          </div>

          <button type="submit" id="changePasswordBtn" class="btn-secondary" style="margin-top: 8px; width: 100%;">
            <span class="spinner" id="passwordSpinner"></span>
            <span id="passwordBtnText">Update Password</span>
          </button>
        </form>

        <div style="margin-top: 24px; display: flex; gap: 8px;">
          <a href="sessions.html" class="btn-primary" style="flex: 1; text-decoration: none; text-align: center; font-size: 0.82rem; padding: 10px 4px; display: flex; align-items: center; justify-content: center;">
            <span>Active Devices</span>
          </a>
          <a href="audit.html" class="btn-primary" style="flex: 1; text-decoration: none; text-align: center; font-size: 0.82rem; padding: 10px 4px; display: flex; align-items: center; justify-content: center; background: rgba(37, 99, 235, 0.3);">
            <span>Audit Trail</span>
          </a>
          <a href="login.html" class="btn-secondary" style="flex: 1; text-decoration: none; text-align: center; font-size: 0.82rem; padding: 10px 4px; display: flex; align-items: center; justify-content: center;">
            <span>Dashboard</span>
          </a>
        </div>
      </div>

    </div>
  </div>

  <script src="js/profile.js"></script>
</body>
</html>
